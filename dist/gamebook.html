  :root {
    color-scheme: light;
    --paper: #f3ecdc; --paper-2: #e9dfc8; --ink: #22190f; --ink-soft: #5c4d3c; --rule: #b9a682;
    --blood: #8e1b12; --good: #2f5d2a; --bad: #8e1b12; --gold: #9a6b12;
    --serif: 'Alegreya', Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    --display: 'IM Fell English SC', 'Alegreya', Georgia, serif;
    --brand: 'Scumbags Type', 'Courier New', Courier, monospace;
    --sheet-w: 320px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--paper); color: var(--ink); font-family: var(--serif);
    font-size: clamp(17px, 1.05rem + 0.2vw, 20px); line-height: 1.55;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-text-size-adjust: 100%;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  #app { min-height: 100%; }

  /* ---------- layout ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: .6rem;
    padding: .45rem .9rem; background: var(--ink); color: var(--paper);
    font-size: .9rem; min-height: 48px;
  }
  .topbar .brand { font-family: var(--display); font-size: 1.15rem; letter-spacing: .02em; margin-right: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip { display: inline-flex; align-items: baseline; gap: .25rem; padding: .1rem .5rem; border: 1px solid #ffffff33; border-radius: 99px; white-space: nowrap; }
  .chip b { font-variant-numeric: tabular-nums; }
  .chip.hp.low { background: var(--blood); border-color: var(--blood); }
  .sheet-toggle { background: var(--paper); color: var(--ink); border: 0; border-radius: 6px; padding: .3rem .7rem; font-weight: 700; cursor: pointer; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr); max-width: 1180px; margin: 0 auto; }
  .page { padding: 1.4rem clamp(1rem, 4vw, 2.6rem) 4rem; max-width: 46rem; width: 100%; margin: 0 auto; }
  .sheet { display: none; }
  @media (min-width: 960px) {
    .layout.with-sheet { grid-template-columns: minmax(0, 1fr) var(--sheet-w); gap: 0; }
    .layout.with-sheet .sheet { display: block; position: sticky; top: 48px; align-self: start; max-height: calc(100vh - 48px); overflow-y: auto; border-left: 1px solid var(--rule); background: var(--paper-2); }
    .sheet-toggle { display: none; }
  }
  /* mobile drawer */
  .drawer-backdrop { position: fixed; inset: 0; background: #0007; z-index: 30; }
  .drawer { position: fixed; inset: auto 0 0 0; max-height: 88vh; overflow-y: auto; z-index: 31; background: var(--paper-2); border-radius: 14px 14px 0 0; box-shadow: 0 -6px 30px #0005; padding-bottom: env(safe-area-inset-bottom); }
  .drawer .close { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; padding: .7rem 1rem; background: var(--paper-2); border-bottom: 1px solid var(--rule); font-family: var(--display); font-size: 1.2rem; }
  .drawer .close button { border: 1px solid var(--ink); background: none; border-radius: 6px; padding: .25rem .7rem; cursor: pointer; }

  /* ---------- text ---------- */
  h1, h2, h3 { font-family: var(--display); font-weight: 400; line-height: 1.15; margin: 0 0 .5rem; }
  h1 { font-size: clamp(2.4rem, 8vw, 4rem); }
  h2 { font-size: 1.6rem; }
  h3 { font-size: 1.15rem; margin-top: 1.1rem; }
  p { margin: 0 0 .9rem; }
  .muted { color: var(--ink-soft); }

  .dice { display: inline-flex; gap: .3rem; vertical-align: middle; }

  .title-page { text-align: center; padding-top: clamp(1.5rem, 8vh, 5rem); }
  .logo { font-family: var(--brand); font-size: clamp(3.2rem, 15vw, 6.5rem); line-height: 1; letter-spacing: .02em; margin: 0 0 .9rem; color: var(--ink); text-shadow: .03em .03em 0 #00000022; }
  .titlebar { display: inline-block; background: var(--ink); color: var(--paper); font-family: var(--brand); font-size: clamp(1.2rem, 4.5vw, 1.8rem); padding: .25rem 1rem .15rem; margin: 0 0 .4rem; }

  .title-page .blurb { max-width: 32rem; margin: 1rem auto 1.6rem; font-style: italic; }
  .title-page .row { justify-content: center; }
  .rule { border: 0; border-top: 1px solid var(--rule); margin: 1.4rem 0; }

const root = document.getElementById('app');

const ui = { screen: 'title', game: null, create: null, sheetOpen: false, sheetMsg: '', ending: null, pickFor: null };

// ---------- tiny DOM helper

// ---------- saving (one viewer's convenience; the game works without it)
function save() {
  try {
    if (ui.screen === 'play' && ui.game) localStorage.setItem(SAVE_KEY, JSON.stringify({ adv: adv.id, game: ui.game.save(), ending: ui.ending }));
  } catch { /* storage unavailable */ }
}
function loadSave() {

// Surviving scumbags, kept between adventures.
function roster() { try { return JSON.parse(localStorage.getItem(ROSTER_KEY) || '[]'); } catch { return []; } }

function go(screen) { ui.screen = screen; ui.sheetOpen = false; render(); window.scrollTo(0, 0); }

// ---------- screens
function render() {

function topbar(extra) {

    h('header', { class: 'topbar' }, h('span', { class: 'brand' }, h('span', { class: 'mark' }, 'Scumbags!'), adv.title)),

// Dice and random numbers. All randomness goes through an Rng so games can be seeded and replayed.

  constructor(seed = (Date.now() ^ 0x5bd1e995) >>> 0) {
    this.seed = seed >>> 0;
    this.state = this.seed;

  next() {
    let t = (this.state = (this.state + 0x6d2b79f5) >>> 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);

  }
  int(lo, hi) { return lo + Math.floor(this.next() * (hi - lo + 1)); }
  die(sides) { return sides > 0 ? this.int(1, sides) : 0; }
  roll(n, sides) { let t = 0; for (let i = 0; i < n; i++) t += this.die(sides); return t; }
  chance(inN, outOf) { return this.die(outOf) <= inN; } // e.g. chance(1, 6) = "1/6 chance"
  pick(arr) { return arr[Math.floor(this.next() * arr.length)]; }
  shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(this.next() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }

function rollExpr(rng, expr, vars = {}) {

    else total += sign * (+p || 0);
  }

}
