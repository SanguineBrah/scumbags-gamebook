  :root {
    color-scheme: light;
    --paper: #f3ecdc; --paper-2: #e9dfc8; --ink: #22190f; --ink-soft: #5c4d3c; --rule: #b9a682;
    --blood: #8e1b12; --good: #2f5d2a; --bad: #8e1b12; --gold: #9a6b12;
    --serif: 'Alegreya', Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    --display: 'IM Fell English SC', 'Alegreya', Georgia, serif;
    --brand: 'Scumbags Type', 'Courier New', Courier, monospace;
    --sheet-w: 320px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--paper); color: var(--ink); font-family: var(--serif);
    font-size: clamp(17px, 1.05rem + 0.2vw, 20px); line-height: 1.55;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-text-size-adjust: 100%;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  #app { min-height: 100%; }

  /* ---------- layout ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: .6rem;
    padding: .45rem .9rem; background: var(--ink); color: var(--paper);
    font-size: .9rem; min-height: 48px;
  }
  .topbar .brand { font-family: var(--display); font-size: 1.15rem; letter-spacing: .02em; margin-right: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip { display: inline-flex; align-items: baseline; gap: .25rem; padding: .1rem .5rem; border: 1px solid #ffffff33; border-radius: 99px; white-space: nowrap; }
  .chip b { font-variant-numeric: tabular-nums; }
  .chip.hp.low { background: var(--blood); border-color: var(--blood); }
  .sheet-toggle { background: var(--paper); color: var(--ink); border: 0; border-radius: 6px; padding: .3rem .7rem; font-weight: 700; cursor: pointer; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr); max-width: 1180px; margin: 0 auto; }
  .page { padding: 1.4rem clamp(1rem, 4vw, 2.6rem) 4rem; max-width: 46rem; width: 100%; margin: 0 auto; }
  .sheet { display: none; }
  @media (min-width: 960px) {
    .layout.with-sheet { grid-template-columns: minmax(0, 1fr) var(--sheet-w); gap: 0; }
    .layout.with-sheet .sheet { display: block; position: sticky; top: 48px; align-self: start; max-height: calc(100vh - 48px); overflow-y: auto; border-left: 1px solid var(--rule); background: var(--paper-2); }
    .sheet-toggle { display: none; }
  }
  /* mobile drawer */
  .drawer-backdrop { position: fixed; inset: 0; background: #0007; z-index: 30; }
  .drawer { position: fixed; inset: auto 0 0 0; max-height: 88vh; overflow-y: auto; z-index: 31; background: var(--paper-2); border-radius: 14px 14px 0 0; box-shadow: 0 -6px 30px #0005; padding-bottom: env(safe-area-inset-bottom); }
  .drawer .close { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; padding: .7rem 1rem; background: var(--paper-2); border-bottom: 1px solid var(--rule); font-family: var(--display); font-size: 1.2rem; }
  .drawer .close button { border: 1px solid var(--ink); background: none; border-radius: 6px; padding: .25rem .7rem; cursor: pointer; }

  /* ---------- text ---------- */
  h1, h2, h3 { font-family: var(--display); font-weight: 400; line-height: 1.15; margin: 0 0 .5rem; }
  h1 { font-size: clamp(2.4rem, 8vw, 4rem); }
  h2 { font-size: 1.6rem; }
  h3 { font-size: 1.15rem; margin-top: 1.1rem; }
  p { margin: 0 0 .9rem; }
  .muted { color: var(--ink-soft); }

// THE INVISIBLE MENAGERIE — steal an invisible egg from a travelling show of invisible animals. For a level 6–7 scumbag.
// Invisible monsters are hard to hit (d20) until something shows their outline: sand, flour, water, a ward, a sharp nose.

const META = {
  after: ['last-ride'], id: 'invisible-menagerie', title: 'The Invisible Menagerie', levels: '6–7', final: 'collector',
  blurb: 'Professor Peculius’s Invisible Menagerie charges five gold to look at empty cages. Everyone assumes it’s a swindle. Lady Vellum, a collector of rare and impossible things, knows better, and will pay 400 gold for the egg of the invisible ostrich. Someone else is after the animals too. Someone from a very long way away.',
};

const porcupine = { name: 'Invisible porcupine', lvl: 3, range: 'engaged', feats: ['invisible'], note: 'Invisible (attacks against it use a d20 until you can see it); very, very spiky' };
const ape = { name: 'Invisible ape', lvl: 6, hp: 20, range: 'short', feats: ['invisible'], onHit: { stat: 'Con', dd: 8, label: 'keep your lunch down', text: 'Invisible faeces. You fall to your knees, retching.', effect: 'prone' }, note: 'Invisible; detected by smell; throws invisible faeces (on hit, d8 Con save or retch on the floor)' };
const visitor = { name: 'The Visitor', lvl: 6, range: 'medium', onHit: { stat: 'Dex', dd: 8, label: 'dodge the ray', text: 'The ray clips you.', effect: 'disintegrate' }, note: 'Ray gun: on hit, d8 Dex save or something non-magical and non-organic you’re wearing turns to dust' };

const SECTIONS = {
  start: {
    text: [
      'Professor Peculius’s Invisible Menagerie has pitched its tent on the common outside Upper Gloaming. Posters show a lot of empty space, beautifully drawn. SEE THE INVISIBLE APE! SEE THE INVISIBLE OSTRICH! SEE NOTHING AT ALL, FOR FIVE GOLD!',
      'Lady Vellum meets you at the gate in a veil and a great many furs. “The ostrich is real,” she says. “It has laid an egg. Invisible, naturally. Four hundred gold, and I shan’t ask how.” As she leaves, something whooshes overhead with no noise at all and lands in the field behind the tent with a soft green glow.',
    ],
    choices: [
      { text: 'Pay 5GP and go in like everyone else', to: 'big_top', if: { gold: 5 }, effects: [{ gold: -5 }] },
      { text: 'Slip under the canvas', test: { stat: 'Dex', dd: 8, skill: ['skulduggery'] }, pass: 'big_top', fail: 'strongman' },
      { text: 'Go and see what landed in the field', to: 'saucer' },
    ],
  },
  strongman: {
    text: ['A hand like a ham lifts you out from under the canvas by your collar. It belongs to Bruno, the menagerie’s strongman, who is also its ticket inspector, cook and vet. “Five gold,” he says, “or I fold you.”'],
    choices: [
      { text: 'Pay up (5GP)', to: 'big_top', if: { gold: 5 }, effects: [{ gold: -5 }] },
      { text: 'Challenge him to arm-wrestle for free entry', test: { stat: 'Str', dd: 8, skill: ['athletics'], profs: ['Pit fighter', 'Sellsword'], why: 'you’ve done this in taverns' }, pass: 'bruno_beaten', fail: 'bruno_fight' },
      { text: 'Fight him', to: 'bruno_fight' },
    ],
  },
  bruno_beaten: {
    on: [{ flag: 'bruno' }],
    text: ['Bruno’s arm goes down with a crash that shakes the tent. He looks at it, then at you, with deep respect. “Free entry,” he says. “And a tip. The ape hates the smell of onions. Never stand downwind of the ape.”'],
    choices: [{ text: 'Go into the big top', to: 'big_top' }],
  },

  if (armourPenalty(c)) dd = 20;
  const skilled = isSkilled(c, o.skill);
  const roll = () => statTest(rng, { stat: c.stats[o.stat] + (o.statBonus || 0), dd, skilled, forceRoll: true, modifier: o.modifier || 0, critRange: o.critRange || 1, critFailFrom: o.critFailFrom || (f.def.unlucky ? 19 : 20) });
  let r = roll();
  const line = (r, extra = '') => note(f, `${o.label}: ${o.stat} ${c.stats[o.stat]}${skilled ? ' (skilled)' : ''} vs d20+d${dd}${o.modifier ? `+${o.modifier}` : ''} → ${rollText(r)} ${r.critSuccess ? 'CRITICAL!' : r.critFail ? 'critical failure' : r.success ? 'success' : 'fail'}${extra}`, 'roll');
  line(r);
  if (!r.success && o.reroll && hasFeature(c, o.reroll) && c.daily.reroll) {
    c.daily.reroll = false; r = roll(); line(r, ' (rerolled — once per day)');
  }
  return r;
}

function playerAttack(g, f, m, opts = {}) {
  const { rng, c } = g;
  const w = opts.weapon === 'sidearm' ? c.sidearm : opts.weapon === 'unarmed' ? null : c.weapon;
  const ranged = !!(w && w.ranged);
  let dd = MELEE_DIE;
  if (ranged) {
    dd = RANGED_DIE[hasFeature(c, 'hunter') ? 1 : f.distance];
    f.fired = true;
  }
  const label = opts.label || `Attack the ${m.name}${w ? ` (${w.name.toLowerCase()})` : ' (unarmed)'}`;
  if (has(m, 'invisible') && !m.revealed) { dd = 20; note(f, `You can’t see the ${m.name}. You swing at where you think it is (d20).`); }
  const t = test(g, f, {
    stat: ranged ? 'Dex' : 'Str', dd, skill: opts.unskilled ? null : ranged ? 'attack:ranged' : 'attack:melee', label,
    modifier: has(m, 'tiny') ? 2 : 0, critRange: hasFeature(c, 'wideCrit') ? 3 : 1, reroll: 'rerollAttack', weaponTest: true, weapon: w,
  });
  let hit = t.success, crit = t.critSuccess;
  if (m.unaware && hit) crit = true;
  if (has(m, 'exposed') && f.distance === 0 && hit && !ranged) { crit = true; note(f, `The ${m.name}’s back is exposed: a critical hit.`); }
  if (!ranged && (m.prone || m.dormant > 0) && !hit) { hit = true; note(f, `The ${m.name} is down: melee attacks against prone opponents always hit.`); }
  if (!hit) { note(f, 'You miss.'); return false; }
  let dmg = rng.die(weaponDamageDie(w)) + c.level;
  if (crit) dmg *= hasFeature(c, 'tripleCrit') ? 3 : 2;
  hurtMonster(g, f, m, dmg, { crit, pulp: m.dormant > 0 });
  if (!alive(m) && !m.dormant && hasFeature(c, 'cleave') && !opts.free) {
    const next = f.monsters.find(alive);
    if (next) { note(f, 'Sellsword: a free attack after slaying an opponent.'); playerAttack(g, f, next, { ...opts, free: true }); }
  }
  if (alive(m) && !ranged && hasFeature(c, 'fell') && !opts.free && rng.chance(1, 6)) {
    m.prone = true; note(f, `Woodcutter: you knock the ${m.name} flat and swing again.`);
    playerAttack(g, f, m, { ...opts, free: true });
  }
  return true;
}

function hurtMonster(g, f, m, dmg, o = {}) {
  if (o.magic && has(m, 'magicImmune')) { note(f, `The ${m.name} is immune to magic.`); return; }
  if (has(m, 'ghostly') && !o.magic && !o.holy && !g.c.flags.blessedWeapon) { note(f, `It passes straight through the ${m.name}. It ignores non-magical damage.`); return; }
  if (has(m, 'takeD6') && !o.noBonus) { const x = g.rng.die(6); dmg += x; note(f, `The ${m.name} receives +${x} damage.`); }
  if (m.ap > 0) { const a = Math.min(m.ap, dmg); m.ap -= a; dmg -= a; note(f, `Its armour soaks up ${a}${m.ap ? ` (${m.ap} AP left)` : ' — the armour is wrecked'}.`); }
  m.hp -= dmg;
  note(f, `${dmg} damage to the ${m.name}${m.hp > 0 ? ` (${m.hp}/${m.maxHp} HP)` : ''}.`, 'hit');
  if (m.hp <= 0) {
    if (m.dormant > 0 || o.pulp) { m.dormant = 0; note(f, `You pulp the ${m.name}. They stay down this time.`, 'good'); return; }
    if (has(m, 'relentless') && !o.fire && !o.crit) {
      m.hp = 0; m.dormant = 2; m.prone = true;
      note(f, `The ${m.name} collapse… and twitch. They must be burned or pulped, or they’ll get back up.`, 'bad');
      return;
    }
    note(f, `The ${m.name} is dead.`, 'good');
    if (has(m, 'burst') && g.c.hp > 0) {
      const s = test(g, f, { stat: 'Dex', dd: 6, skill: 'save:Dex', label: `Dex save: the ${m.name} explodes`, reroll: 'rerollSave' });
      if (!s.success) hurtPlayer(g, f, rollExpr(g.rng, '2d6'), 'explosion');
      else note(f, 'You dive clear of the blast.');
    }
  } else if (has(m, 'coward') && m.hp < m.maxHp / 2) {
    m.fled = true; note(f, `The ${m.name} bursts into tears and gives up.`, 'good');
  }
}

function hurtPlayer(g, f, dmg, src) {
  const { c, rng } = g;
  if (c.blocking && c.shield) {
    const b = Math.min(dmg, rng.roll(c.shield.block[0], c.shield.block[1]));
    dmg -= b; c.blocking = false; note(f, `Your ${c.shield.name.toLowerCase()} blocks ${b}.`);
  }
  const toAp = Math.min(c.ap, dmg); c.ap -= toAp; dmg -= toAp;
  const toHp = Math.min(c.hp, dmg); c.hp -= toHp;
  note(f, `The ${src} hits you: ${toAp ? `${toAp} to AP, ` : ''}${toHp} to HP. (${c.hp}/${c.maxHp} HP, ${c.ap} AP)`, 'bad');
  if (c.hp <= 0) {
    const salve = c.significant.find((i) => i.id === 'salve' && i.uses > 0);
    if (salve) { salve.uses = 0; c.significant = c.significant.filter((i) => i !== salve); c.hp = 1; note(f, 'You fall, bleeding out, and slap clotting salve on the wound. Back up, on 1 HP.', 'good'); }
    else { f.over = true; f.lost = true; note(f, 'You fall to the floor and bleed out. Your adventure ends here.', 'bad'); }
  }
}

function monsterAttack(g, f, m) {
  const { c, rng } = g;
  if (has(m, 'handgun') && rng.chance(1, 3)) { note(f, `The ${m.name} fumbles with the safety catch.`); return; }
  if (has(m, 'noEngaged') && f.distance === 0) { note(f, `You’re too close for the ${m.name} to do anything but shout.`); return; }
  const melee = m.range === 'engaged';
  let crit = false;
  if (c.prone && melee) { note(f, 'You’re on the floor: the attack can’t miss.'); }
  else {
    const t = test(g, f, { stat: c.stats.Dex > c.stats.Str ? 'Dex' : 'Str', dd: m.dd, skill: melee ? 'defend:melee' : 'defend:ranged', label: `Defend against the ${m.name}`, reroll: 'rerollDefend', weaponTest: true, critFailFrom: has(m, 'critWide') ? 17 : undefined });
    if (t.success) {
      note(f, 'It misses.');
      if (melee && hasFeature(c, 'counter') && alive(m)) { note(f, 'Pit fighter: you counterattack.'); playerAttack(g, f, m, { free: true }); }
      return;
    }
    if (t.critFail) note(f, 'Critical failure: double damage!', 'bad');
    crit = t.critFail;
  }
  let dmg = m.dmg ? rollExpr(rng, m.dmg, { lvl: m.lvl }) : rng.die(m.dd) + m.lvl;
  if (has(m, 'dealD6')) dmg += rng.die(6);
  if (crit) dmg *= 2;
  hurtPlayer(g, f, dmg, m.name);
  if (m.onHit && c.hp > 0) {
    const o = m.onHit;
    const s = test(g, f, { stat: o.stat, dd: o.dd, skill: `save:${o.stat}`, label: `${o.stat} save: ${o.label}`, reroll: 'rerollSave' });
    if (!s.success) {
      note(f, o.text, 'bad');
      if (o.effect === 'prone' && !hasFeature(c, 'noProne')) c.prone = true;
      if (o.effect === 'gold') { const lost = Math.min(o.amount, c.gold); c.gold -= lost; note(f, `−${lost}GP.`, 'bad'); }
      if (o.effect === 'damage') hurtPlayer(g, f, rollExpr(rng, o.amount), o.label);
      if (o.effect === 'disintegrate') {
        if (c.armour) { note(f, `Your ${c.armour.name.toLowerCase()} turns to dust.`, 'bad'); c.armour = null; c.ap = 0; }
        else if (c.shield) { note(f, `Your ${c.shield.name.toLowerCase()} turns to dust.`, 'bad'); c.shield = null; }
        else if (c.weapon && !['dagger', 'sling', 'bow'].includes(c.weapon.id)) { note(f, `Your ${c.weapon.name.toLowerCase()} turns to dust. You draw your dagger.`, 'bad'); c.weapon = { id: 'dagger', name: 'Dagger', weight: 1, ranged: false }; }
        else note(f, 'Everything you’re carrying that could turn to dust already has. The ray tickles.');
      }
    }
  }
  if (has(m, 'contract') && c.hp > 0) {
    const s = test(g, f, { stat: 'Cha', dd: 4, skill: 'save:Cha', label: 'Cha save against the contract', reroll: 'rerollSave' });
    if (!s.success) { const lost = Math.min(10, c.gold); c.gold -= lost; note(f, `Ink everywhere, and somehow you’ve signed something. −${lost}GP.`, 'bad'); }
  }
  if (has(m, 'vomit') && c.hp > 0 && !hasFeature(c, 'noProne')) {
    const s = test(g, f, { stat: 'Dex', dd: 4, skill: 'save:Dex', label: 'Dex save against the slippery vomit', reroll: 'rerollSave' });
    if (!s.success) { c.prone = true; note(f, 'You slip and fall prone.', 'bad'); }
  }
}

function monstersTurn(g, f) {
  const { c } = g;
  for (const m of f.monsters) {
    if (f.over) return;
    if (m.dormant > 0) {
      if (--m.dormant === 0) { m.hp = Math.ceil(m.maxHp / 2); m.prone = false; note(f, `The ${m.name} get back up (${m.hp} HP).`, 'bad'); }
      continue;
    }
    if (!alive(m)) continue;
    if (m.unaware) continue;
    if (m.stunned > 0) { m.stunned--; note(f, `The ${m.name} is still rubbing sand out of its eyes.`); continue; }
    if (m.prone) { m.prone = false; }
    if (has(m, 'approval')) { m.tick ^= 1; if (m.tick) { note(f, `The ${m.name} waits for the action to be approved.`); continue; } }
    if (m.range === 'engaged' && f.distance > 0) {
      f.distance -= 1;
      if (f.distance > 0) { note(f, `The ${m.name} advances (${BANDS[f.distance].toLowerCase()} range).`); continue; }
      note(f, `The ${m.name} closes in.`);
    }
    if (has(m, 'breath') && g.rng.chance(1, 3)) {
      const s = test(g, f, { stat: 'Dex', dd: m.dd, skill: 'save:Dex', label: `Dex save: the ${m.name} breathes fire`, reroll: 'rerollSave' });
      const d = rollExpr(g.rng, `${Math.ceil(m.lvl / 2)}d6`);
      hurtPlayer(g, f, s.success ? Math.floor(d / 2) : d, 'fire');
      continue;
    }
    for (let i = 0; i < attacksOf(m) && !f.over; i++) monsterAttack(g, f, m);
    if (has(m, 'topple')) { m.prone = true; note(f, `The ${m.name} falls over.`); }
  }
  for (const m of f.monsters) if (alive(m) && m.regen && !(m.regenStop && c.flags[m.regenStop])) {
    const h = Math.min(m.regen, m.maxHp - m.hp); if (h > 0) { m.hp += h; note(f, `The ${m.name} heals ${h} HP.`, 'bad'); }
  }
}

/** Actions available to the player this turn. */
function actions(g, f) {
  const { c } = g;
  if (f.over) return [];
  const out = [];
  const targets = active(f);
  const melee = c.weapon && !c.weapon.ranged;
  const canMelee = f.distance <= 1;
  for (const m of targets) {
    if (c.weapon.ranged) {
      if (hasItem(c, 'ammo')) out.push({ id: 'shoot', target: m.uid, label: `Shoot the ${m.name} (${BANDS[f.distance]}: d${RANGED_DIE[hasFeature(c, 'hunter') ? 1 : f.distance]})${f.distance === 0 ? ' — gives free attacks' : ''}` });
      if (canMelee && c.sidearm) out.push({ id: 'sidearm', target: m.uid, label: `Stab the ${m.name} with your dagger` });
    } else if (canMelee) out.push({ id: 'attack', target: m.uid, label: m.dormant > 0 ? `Pulp the ${m.name} while they’re down` : `Attack the ${m.name}` });
  }
  if (f.distance === 0 && c.weapon.ranged && hasItem(c, 'ammo') && !f.def.cornered) out.push({ id: 'fallback', target: targets[0] && targets[0].uid, label: 'Fall back a little, then shoot' });
  if (!canMelee && !out.some((a) => a.id === 'shoot')) out.push({ id: 'advance', label: 'Advance' });
  // nothing to hit them with: fists
  if (canMelee && !out.some((a) => ['attack', 'sidearm', 'shoot'].includes(a.id))) for (const m of targets) out.push({ id: 'unarmed', target: m.uid, label: `Punch the ${m.name} (unarmed, d4)` });
  if (c.slots[1]) {
    if (magicType(c) === 'arcane') for (const m of targets) if (alive(m)) out.push({ id: 'bolt', target: m.uid, label: `Cast Arcane bolt at the ${m.name}` });
    if (magicType(c) === 'divine' && c.alignment === 'chaos' && hasItem(c, 'holysymbol')) out.push({ id: 'famine', label: 'Cast Famine (summon a swarm of locusts)' });
  }
  if (magicType(c) === 'divine') for (const m of targets) if (has(m, 'undead') && alive(m)) out.push({ id: 'turn', target: m.uid, label: `Turn the ${m.name}` });
  if (hasItem(c, 'potion') && c.hp < c.maxHp) out.push({ id: 'potion', label: 'Drink a healing potion' });
  if (hasItem(c, 'caltrops')) out.push({ id: 'caltrops', label: 'Scatter caltrops' });
  for (const [id, verb] of [['fire', 'Throw alchemist’s fire at'], ['acid', 'Throw acid at'], ['holywater', 'Splash holy water on'], ['pocketsand', 'Throw pocket sand at']]) {
    if (hasItem(c, id)) for (const m of targets) if (alive(m) || (id === 'fire' && m.dormant)) out.push({ id, target: m.uid, label: `${verb} the ${m.name}` });
  }
  if (c.shield && !c.blocking) out.push({ id: 'block', label: `Block with your ${c.shield.name.toLowerCase()}` });
  for (const sp of f.def.special || []) if (!(sp.flag && c.flags[sp.flag]) && check(c, sp.if).ok) out.push({ id: 'special', sp, label: sp.label });
  if (f.def.flee) out.push({ id: 'flee', label: f.def.flee.label || 'Run for it' });
  return out;
}

function useUp(c, id) {
  for (const list of ['mundane', 'significant']) {
    const it = c[list].find((i) => i.id === id && (i.uses === undefined || i.uses > 0));
    if (it) { if (it.uses !== undefined) it.uses -= 1; if (!it.uses) c[list] = c[list].filter((x) => x !== it); return; }
  }
}

/** Perform a player action, then the monsters act. */
function act(g, f, a) {
  const { c, rng } = g;
  if (f.over) return;
  f.log = [];
  const m = f.monsters.find((x) => x.uid === a.target);
  if (c.prone) { c.prone = false; note(f, 'You get up (standing is free).'); }
  switch (a.id) {
    case 'unarmed': if (f.distance > 0) f.distance = 0; playerAttack(g, f, m, { weapon: 'unarmed' }); break;
    case 'attack': case 'sidearm': {
      if (f.distance > 0) { f.distance = 0; note(f, 'You close in.'); }
      playerAttack(g, f, m, { weapon: a.id === 'sidearm' ? 'sidearm' : 'main' });
      if (hasFeature(c, 'extraAttack') && !f.over) {
        const t = alive(m) || m.dormant ? m : f.monsters.find(alive);
        if (t) playerAttack(g, f, t, { weapon: a.id === 'sidearm' ? 'sidearm' : 'main', unskilled: true, free: true, label: `Envoy: an extra attack on the ${t.name} (unskilled)` });
      }
      break;
    }
    case 'shoot': case 'fallback': {
      if (a.id === 'fallback') { f.distance = 1; note(f, 'You back off to short range.'); }
      else if (f.distance === 0) {
        note(f, 'Shooting while engaged: everyone in reach gets a free attack.');
        for (const x of f.monsters) if (alive(x) && x.range === 'engaged' && !x.unaware && !f.over) monsterAttack(g, f, x);
      }
      if (!f.over) playerAttack(g, f, m || f.monsters.find(alive), { weapon: 'main' });
      break;
    }
    case 'advance': f.distance = Math.max(0, f.distance - 1); note(f, `You advance (${BANDS[f.distance].toLowerCase()} range).`); break;
    case 'bolt': {
      const t = test(g, f, { stat: 'Int', dd: 4, skill: 'cast:arcane', label: 'Cast Arcane bolt (Int)' });
      if (t.success) { if (t.ddRoll >= 4) { c.slots[1] = false; note(f, 'You rolled 4 on the difficulty die: the spell slot is spent.'); } hurtMonster(g, f, m, 2 * c.level, { magic: true }); }
      else if (t.critFail) { const d = rng.die(4); note(f, `Overwhelmed by ætheric currents, you take ${d} damage.`, 'bad'); hurtPlayer(g, f, d, 'backlash'); }
      else note(f, 'The spell fizzles.');
      break;
    }
    case 'famine': {
      const t = test(g, f, { stat: 'Wis', dd: 4, skill: 'cast:divine', label: 'Cast Famine (Wis)' });
      if (t.success) {
        if (t.ddRoll >= 4) { c.slots[1] = false; note(f, 'The spell slot is spent.'); }
        note(f, 'A swarm of locusts pours out of your sleeves.', 'good');
        for (const x of f.monsters) if (alive(x)) hurtMonster(g, f, x, rng.die(6), { magic: true, noBonus: true });
      } else if (t.critFail) { note(f, 'Your god scorns you: the locusts turn into a single day’s rations. Abundance. Lovely.', 'bad'); }
      else note(f, 'Nothing happens.');
      break;
    }
    case 'turn': {
      const t = test(g, f, { stat: 'Wis', dd: m.dd, skill: 'cast:divine', label: `Turn the ${m.name} (Wis)` });
      if (t.success) {
        if (c.alignment === 'chaos') { m.obeys = true; c.flags.undeadObeys = true; note(f, `The ${m.name} bows to you. It obeys you now.`, 'good'); }
        else { m.fled = true; c.flags.undeadFled = true; note(f, `The ${m.name} flees from your holy symbol.`, 'good'); }
      } else note(f, `The ${m.name} is unimpressed.`);
      break;
    }
    case 'potion': { useUp(c, 'potion'); const h = rollExpr(rng, '2d6') + (hasFeature(c, 'favoured') ? c.level : 0); c.hp = Math.min(c.maxHp, c.hp + h); note(f, `You drink a healing potion: +${h} HP (${c.hp}/${c.maxHp}).`, 'good'); break; }
    case 'fire': useUp(c, 'fire'); note(f, 'You throw the alchemist’s fire.'); hurtMonster(g, f, m, rollExpr(rng, '2d8'), { fire: true, pulp: m.dormant > 0 }); break;
    case 'acid': useUp(c, 'acid'); note(f, 'You throw the vial of acid.'); hurtMonster(g, f, m, rollExpr(rng, '2d4')); break;
    case 'holywater': useUp(c, 'holywater');
      if (has(m, 'undead') || has(m, 'ghostly')) hurtMonster(g, f, m, rollExpr(rng, '2d8'), { holy: true }); else note(f, `The ${m.name} is now slightly damp and blessed.`);
      break;
    case 'caltrops': {
      useUp(c, 'caltrops'); note(f, 'You scatter caltrops.');
      for (const x of f.monsters) if (alive(x) && x.range === 'engaged' && !has(x, 'flies')) {
        hurtMonster(g, f, x, rng.die(4), { noBonus: true });
        if (alive(x) && f.distance > 0) { x.stunned = 1; note(f, `The ${x.name} stops to pick spikes out of its feet.`); }
      }
      break;
    }
    case 'pocketsand': useUp(c, 'pocketsand'); m.stunned = 1; if (has(m, 'invisible')) { m.revealed = true; note(f, `The sand sticks to the ${m.name}, and now you can see its outline.`, 'good'); } note(f, `Pocket sand! The ${m.name} can’t act until after its next turn.`, 'good'); break;
    case 'special': {
      const sp = a.sp;
      if (sp.test) {
        const t = test(g, f, { ...sp.test, label: sp.label });
        if (!t.success) { note(f, sp.failText || 'It doesn’t work.'); break; }
      }
      if (sp.flag) c.flags[sp.flag] = true;
      note(f, sp.text, 'good');
      if (sp.dmg) { const t = f.monsters.find(alive); if (t) hurtMonster(g, f, t, rollExpr(rng, sp.dmg), { noBonus: true }); }
      if (sp.win) { for (const x of f.monsters) if (alive(x)) x.fled = true; }
      if (sp.reveal) { for (const x of f.monsters) x.revealed = true; }
      if (sp.stun) { for (const x of f.monsters) if (alive(x)) x.stunned = sp.stun; }
      break;
    }
    case 'block': c.blocking = true; note(f, `You raise your ${c.shield.name.toLowerCase()}.`); break;
    case 'flee': {
      note(f, 'You run. Everyone in reach takes a parting swing.');
      for (const x of f.monsters) if (alive(x) && !x.unaware && (x.range !== 'engaged' || f.distance === 0) && !f.over) monsterAttack(g, f, x);
      if (!f.over) { f.over = true; f.fled = true; }
      return finish(g, f);
    }
  }
  for (const x of f.monsters) x.unaware = false;
  if (!f.over && !active(f).length) { f.over = true; f.won = true; return finish(g, f); }
  if (!f.over && f.monsters.some((x) => alive(x) && has(x, 'unluckyAura')) && !hasFeature(c, 'noProne') && rng.chance(2, 6)) { c.prone = true; note(f, 'Your luck runs out, along with your footing. You fall prone.', 'bad'); }
  if (!f.over) monstersTurn(g, f);
  if (!f.over && !active(f).length) { f.over = true; f.won = true; }
  f.round++;
  return finish(g, f);
}

function finish(g, f) {
  const { c } = g;
  if (!f.over) return;
  c.blocking = false; c.prone = false;
  if (f.fired) { const ammo = c.mundane.find((i) => i.id === 'ammo'); if (ammo) { ammo.tokens -= 1; note(f, `Ammunition: ${ammo.tokens} left.`); if (ammo.tokens <= 0) c.mundane = c.mundane.filter((i) => i !== ammo); } }
  if (f.won) { note(f, 'Victory. Ten minutes’ rest restores your AP.', 'good'); c.ap = maxAp(c); }
  if (f.fled) { c.ap = maxAp(c); }
}
