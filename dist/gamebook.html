<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

  button, input, select, textarea { font: inherit; color: inherit; }
  #app { min-height: 100%; }

  /* ---------- layout ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: .6rem;
    padding: .45rem .9rem; background: var(--ink); color: var(--paper);
    font-size: .9rem; min-height: 48px;

  .topbar .brand { font-family: var(--display); font-size: 1.15rem; letter-spacing: .02em; margin-right: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip { display: inline-flex; align-items: baseline; gap: .25rem; padding: .1rem .5rem; border: 1px solid #ffffff33; border-radius: 99px; white-space: nowrap; }
  .chip b { font-variant-numeric: tabular-nums; }
  .chip.hp.low { background: var(--blood); border-color: var(--blood); }
  .sheet-toggle { background: var(--paper); color: var(--ink); border: 0; border-radius: 6px; padding: .3rem .7rem; font-weight: 700; cursor: pointer; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr); max-width: 1180px; margin: 0 auto; }
  .page { padding: 1.4rem clamp(1rem, 4vw, 2.6rem) 4rem; max-width: 46rem; width: 100%; margin: 0 auto; }
  .sheet { display: none; }
  @media (min-width: 960px) {
    .layout.with-sheet { grid-template-columns: minmax(0, 1fr) var(--sheet-w); gap: 0; }
    .layout.with-sheet .sheet { display: block; position: sticky; top: 48px; align-self: start; max-height: calc(100vh - 48px); overflow-y: auto; border-left: 1px solid var(--rule); background: var(--paper-2); }
    .sheet-toggle { display: none; }

  .drawer-backdrop { position: fixed; inset: 0; background: #0007; z-index: 30; }
  .drawer { position: fixed; inset: auto 0 0 0; max-height: 88vh; overflow-y: auto; z-index: 31; background: var(--paper-2); border-radius: 14px 14px 0 0; box-shadow: 0 -6px 30px #0005; padding-bottom: env(safe-area-inset-bottom); }
  .drawer .close { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; padding: .7rem 1rem; background: var(--paper-2); border-bottom: 1px solid var(--rule); font-family: var(--display); font-size: 1.2rem; }
  .drawer .close button { border: 1px solid var(--ink); background: none; border-radius: 6px; padding: .25rem .7rem; cursor: pointer; }

  /* ---------- text ---------- */
  h1, h2, h3 { font-family: var(--display); font-weight: 400; line-height: 1.15; margin: 0 0 .5rem; }
  h1 { font-size: clamp(2.4rem, 8vw, 4rem); }
  h2 { font-size: 1.6rem; }
  h3 { font-size: 1.15rem; margin-top: 1.1rem; }
  p { margin: 0 0 .9rem; }
  .muted { color: var(--ink-soft); }
  .small { font-size: .85rem; }
  .num { font-family: var(--display); font-size: clamp(2.6rem, 9vw, 3.6rem); line-height: 1; text-align: center; margin: .2rem 0 1rem; }
  .num::before, .num::after { content: ''; display: inline-block; width: 2.2rem; height: 1px; background: var(--ink); vertical-align: middle; margin: 0 .8rem; }
  .story p:first-child::first-letter { font-family: var(--display); font-size: 3.1em; float: left; line-height: .85; padding: .08em .08em 0 0; color: var(--blood); }
  .msg { border-left: 3px solid var(--rule); padding: .15rem .7rem; margin: .4rem 0; font-size: .92rem; }

  /* ---------- rolls & choices ---------- */

  .choice .sub { display: block; font-size: .8rem; color: var(--ink-soft); margin-top: .1rem; }

  .log div { padding: .1rem 0; } .log .roll-l { font-variant-numeric: tabular-nums; color: var(--ink-soft); }
  .log .hit { } .log .good { color: var(--good); font-weight: 700; } .log .bad { color: var(--bad); }
  .actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: .45rem; margin-top: .7rem; }
  .actions .btn { width: 100%; text-align: left; font-weight: 400; }
  .actions .btn.primary { font-weight: 700; }

  /* ---------- adventure sheet ---------- */
  .sheet-inner { padding: 1rem; font-size: .92rem; }
  .sheet-inner h2 { font-size: 1.35rem; margin-bottom: .1rem; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: .35rem; margin: .6rem 0; }
  .stat { text-align: center; border: 1px solid var(--rule); border-radius: 6px; padding: .2rem 0; background: var(--paper); }
  .stat .k { font-size: .75rem; color: var(--ink-soft); display: block; } .stat .v { font-size: 1.25rem; font-weight: 700; }
  .stat.core { border-color: var(--ink); }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: .15rem .6rem; }
  .kv dt { color: var(--ink-soft); } .kv dd { margin: 0; }
  .items { margin: .2rem 0 .4rem; padding-left: 1.1rem; } .items li { margin: .1rem 0; }
  .sheet-inner .btn { padding: .4rem .7rem; min-height: 38px; font-size: .88rem; }

  /* ---------- creation ---------- */
  .card { background: #fffaf0; border: 1px solid var(--rule); border-radius: 10px; padding: 1rem; margin: 1rem 0; }
  .opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .4rem; }
  .opt { display: flex; gap: .5rem; align-items: flex-start; border: 1px solid var(--rule); border-radius: 8px; padding: .45rem .6rem; background: var(--paper); cursor: pointer; font-size: .92rem; }
  .opt input { margin-top: .3rem; accent-color: var(--ink); }
  .opt.on { border-color: var(--ink); background: #fff; }
  .opt .note { display: block; font-size: .78rem; color: var(--ink-soft); }
  input[type=text] { color: var(--ink); -webkit-text-fill-color: var(--ink); caret-color: var(--ink); font: inherit; padding: .45rem .6rem; border: 1.5px solid var(--ink); border-radius: 6px; background: #fff; width: min(100%, 22rem); }
  .dice { display: inline-flex; gap: .3rem; vertical-align: middle; }
  .die { display: inline-grid; place-items: center; min-width: 2rem; height: 2rem; padding: 0 .3rem; border: 1.5px solid var(--ink); border-radius: 6px; background: #fff; font-weight: 700; font-variant-numeric: tabular-nums; }
  .title-page { text-align: center; padding-top: clamp(1.5rem, 8vh, 5rem); }
  .title-page .blurb { max-width: 32rem; margin: 1rem auto 1.6rem; font-style: italic; }
  .title-page .row { justify-content: center; }
  .rule { border: 0; border-top: 1px solid var(--rule); margin: 1.4rem 0; }
  .endeavour { border-left: 3px solid var(--gold); padding: .3rem .8rem; margin: .7rem 0; background: #fffaf0; }
  .banner { text-align: center; font-family: var(--display); font-size: 2rem; margin: 1.4rem 0 .4rem; }
  .banner.dead { color: var(--blood); }
</style>
</head>

// Stat tests: roll d20 (skill die) + difficulty die; succeed if the total is less than the stat.
// A 1 on the skill die is always a critical success, a 20 always a critical failure.
// Skilled tests roll twice and use the better result.

function single(rng, stat, dd, opts) {
  const skill = rng.die(20);
  const ddRoll = dd ? rng.die(dd) : 0;
  const total = skill + ddRoll + (opts.modifier || 0);
  const critLow = opts.critRange || 1;
  const critSuccess = skill <= critLow;
  const critFail = skill >= (opts.critFailFrom || 20);
  const success = critSuccess || (!critFail && total < stat);
  return { skill, ddRoll, total, success, critSuccess: critSuccess && success, critFail, dd };
}

// better of two results: success beats failure; crit success beats success; among successes the lower total
function better(a, b) {
  const score = (r) => (r.critSuccess ? 3 : r.success ? 2 : r.critFail ? 0 : 1);
  if (score(a) !== score(b)) return score(a) > score(b) ? a : b;
  return a.total <= b.total ? a : b;
}

/**
 * statTest(rng, { stat, dd, skilled, modifier, critRange, critFailFrom })
 * dd = 0 means trivial: no roll, automatic success (rulebook: "Trivial: No roll").
 */
function statTest(rng, o) {
  if (!o.dd && !o.forceRoll) {
    return { success: true, critSuccess: false, critFail: false, trivial: true, total: 0, skill: 0, ddRoll: 0, dd: 0, rolls: [] };
  }
  const a = single(rng, o.stat, o.dd, o);
  if (!o.skilled) return { ...a, rolls: [a], skilled: false };
  const b = single(rng, o.stat, o.dd, o);
  return { ...better(a, b), rolls: [a, b], skilled: true };
}

// Short human-readable summary, e.g. "Str 12 vs d20+d8: 7+3=10 hit"
function describeTest(label, stat, r) {
  if (r.trivial) return `${label}: trivial`;
  const show = (x) => `${x.skill}+${x.ddRoll}=${x.total}`;
  const rolls = r.rolls.map(show).join(r.skilled ? ' / ' : '');
  const tag = r.critSuccess ? 'CRITICAL!' : r.critFail ? 'CRITICAL FAIL' : r.success ? 'success' : 'fail';
  return `${label} ${stat} vs d20+d${r.dd}: ${rolls} ${tag}`;
}

// Probability helper used by tests/balancing: chance that d20 + dd < stat (no crits considered except 1/20).
function successChance(stat, dd, skilled = false) {
  let ok = 0, n = 0;
  for (let s = 1; s <= 20; s++) for (let d = 1; d <= Math.max(dd, 1); d++) {
    const total = s + (dd ? d : 0);
    n++; if (s === 1 || (s !== 20 && total < stat)) ok++;
  }
  const p = ok / n;
  return skilled ? 1 - (1 - p) * (1 - p) : p;
}

// Contests (rulebook "Contests"): both test; if one succeeds they win; if both, highest total wins;
// otherwise (or tie) the instigator fails. A critical success beats any other result.
function contest(rng, instigator, defender) {
  const a = statTest(rng, { ...instigator, forceRoll: true });
  const b = statTest(rng, { ...defender, forceRoll: true });
  let winner = 'defender';
  if (a.critSuccess && !b.critSuccess) winner = 'instigator';
  else if (b.critSuccess && !a.critSuccess) winner = 'defender';
  else if (a.success && !b.success) winner = 'instigator';
  else if (a.success && b.success && a.total > b.total) winner = 'instigator';
  return { winner, a, b };
}

return { statTest, describeTest, successChance, contest };
